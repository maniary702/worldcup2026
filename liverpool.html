<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}

  .wrap{max-width:680px;margin:0 auto;padding:0 12px 80px}
  header{background:linear-gradient(135deg,var(--pur),var(--pur2));color:#fff;padding:12px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .hd{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .hd .crest{width:40px;height:40px;flex:0 0 auto;background:#fff;border-radius:9px;padding:3px}
  .hd .crest img{width:100%;height:100%;object-fit:contain}
  .hd h1{font-size:15px;margin:0;font-weight:800;line-height:1.05}
  .hd .sub{font-size:11px;opacity:.85;font-weight:600}
  .hd .share{margin-left:auto;background:var(--pink);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-weight:800;font-size:12px;cursor:pointer}
  .teambar{max-width:680px;margin:8px auto 0;display:flex;align-items:center;gap:8px}
  .teambar label{font-size:11px;font-weight:700;opacity:.85;color:#fff}
  .teambar select{flex:1;border:0;border-radius:10px;padding:9px 10px;font-weight:800;font-size:14px;background:#fff;color:var(--pur)}
  nav.tabs{position:sticky;top:108px;z-index:20;background:var(--bg);max-width:680px;margin:0 auto;display:flex;gap:6px;padding:10px 12px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer}
  nav.tabs button.on{background:var(--pur);color:#fff;border-color:var(--pur)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:0 0 10px}
  .view{display:none}.view.on{display:block}
  .hero{background:var(--card);border:2px solid var(--pur);border-radius:16px;padding:14px;margin:12px 0}
  .hero .top{display:flex;align-items:center;gap:12px}
  .hero .top img{width:52px;height:52px;object-fit:contain}
  .hero .tn{font-size:20px;font-weight:900;line-height:1}
  .hero .ssub{font-size:12px;color:var(--mut);font-weight:700;margin-top:3px}
  .cdbig{margin-left:auto;text-align:center;background:var(--pur);color:#fff;border-radius:12px;padding:8px 12px}
  .cdbig b{font-size:22px;font-weight:900;display:block;line-height:1}
  .cdbig span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.85}
  .pos{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
  .posnum{font-size:34px;font-weight:900;color:var(--pur);line-height:1}
  .poslab{font-size:12px;color:var(--mut);font-weight:700}
  .ptsb{margin-left:auto;text-align:right}.ptsb b{font-size:26px;font-weight:900}
  .form{display:flex;gap:5px;margin-top:8px}
  .fp{width:22px;height:22px;border-radius:6px;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
  .fp.W{background:var(--w)}.fp.D{background:var(--d)}.fp.L{background:var(--l)}
  .lab{font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .fixrow{display:flex;align-items:center;gap:8px;padding:6px 0}
  .fixrow img.b{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
  .fixrow .tn{font-weight:700;font-size:13px;flex:1}
  .fixrow .tn.r{text-align:right}
  .fixrow .sc{font-weight:900;font-size:15px;white-space:nowrap;padding:0 4px}
  .fixrow .vs{color:var(--mut);font-weight:700;padding:0 4px}
  .fmeta{font-size:11px;color:var(--mut);font-weight:600;margin:-2px 0 6px 32px}
  .cd{color:var(--pink);font-weight:800}

  table.lg tr.eu td{box-shadow:inset 3px 0 0 var(--grn)}
  table.lg tr.rel td{box-shadow:inset 3px 0 0 var(--l)}
  table.lg tr.me{background:#faf0fb;font-weight:800}
  table.lg td.pt{font-weight:900}

  .miniform i{width:7px;height:7px;border-radius:2px;display:inline-block}
  .miniform i.W{background:var(--w)}.miniform i.D{background:var(--d)}.miniform i.L{background:var(--l)}
  .legend{font-size:11px;color:var(--mut);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .legend .eu::before{background:var(--grn)}.legend .rel::before{background:var(--l)}

  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .gw{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .pl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
  .pl img{width:62px;height:79px;object-fit:cover;object-position:top;margin:0 auto 4px;border-radius:8px;background:#eef0f3}
  .pl .nm{font-weight:800;font-size:12px;line-height:1.15;min-height:28px;display:flex;align-items:center;justify-content:center}
  .pl .st{font-size:11px;color:var(--mut);margin-top:2px}.pl .st b{color:var(--pink)}
  .posh{font-size:12px;font-weight:800;color:var(--pur);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  .scr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}

  .scr .rk{width:20px;text-align:center;font-weight:800;color:var(--mut)}
  .scr img.pp{width:34px;height:43px;object-fit:cover;object-position:top;border-radius:7px;background:#eef0f3}
  .scr img.bb{width:18px;height:18px;object-fit:contain}
  .scr .nm{font-weight:700}
  .scr .g{margin-left:auto;font-weight:900;font-size:16px;color:var(--pink)}
  .scr .a{font-size:11px;color:var(--mut);font-weight:700;width:54px;text-align:right}

  function miniForm(seq){var h='<span class="miniform">';for(var i=0;i<seq.length;i++){h+='<i class="'+seq.charAt(i)+'"></i>';}return h+'</span>';}

  function teamFixtures(c){var a=[];for(var i=0;i<D.fixtures.length;i++){var f=D.fixtures[i];if(f[2]===c||f[3]===c)a.push(f);}return a;}
  function rowFixture(f){ // [gw,ko,h,a,hs,as,status]
    var d=parseKO(f[1]), done=(f[6]==='C'&&f[4]!=null);
    var h='<div class="fixrow">';
    h+='<img class="b" src="'+badge(f[2])+'" onerror="'+bErr()+'" alt=""/>';
    h+='<span class="tn">'+esc(tShort(f[2]))+'</span>';
    if(done)h+='<span class="sc">'+f[4]+'–'+f[5]+'</span>';
    else h+='<span class="vs">v</span>';
    h+='<span class="tn r">'+esc(tShort(f[3]))+'</span>';
    h+='<img class="b" src="'+badge(f[3])+'" onerror="'+bErr()+'" alt=""/></div>';
    h+='<div class="fmeta">'+esc(fmtDate(d))+(d?' · '+fmtTime(d):'')+(done?'':' <span class="cd">'+countdown(d)+'</span>')+'</div>';
    return h;
  }

  // ===== HUB =====
  function renderHub(){
    var lt=null;for(var i=0;i<D.table.length;i++){if(D.table[i][1]===FT){lt=D.table[i];break;}}
    var tf=teamFixtures(FT);
    var next=null,last=null;
    for(var j=0;j<tf.length;j++){if(tf[j][6]==='C'&&tf[j][4]!=null)last=tf[j];else if(!next)next=tf[j];}
    var start=parseKO(M.startDate), dleft=daysTo(start);
    var h='<div class="hero"><div class="top"><img src="'+badge(FT)+'" onerror="'+bErr()+'" alt=""/>'+
          '<div><div class="tn">'+esc(tName(FT))+'</div><div class="ssub">Premier League '+esc(M.season)+'</div></div>';
    if(M.plPlayed===0&&dleft!=null&&dleft>0){h+='<div class="cdbig"><b>'+dleft+'</b><span>days to kick-off</span></div>';}
    h+='</div>';
    if(lt&&M.plPlayed>0){
      h+='<div class="pos"><span class="posnum">'+lt[0]+ord(lt[0])+'</span><span class="poslab">'+lt[2]+' played · '+lt[3]+'W '+lt[4]+'D '+lt[5]+'L</span>'+
         '<span class="ptsb"><b>'+lt[7]+'</b><br><span class="poslab">pts</span></span></div>'+formPills(lt[8]||'');
    } else {
      h+='<div class="pos" style="margin-top:10px"><span class="poslab">Season kicks off '+esc(fmtDate(start))+'. Position &amp; form appear once games are played.</span></div>';
    }
    if(next){h+='<div class="lab">Next match</div>'+rowFixture(next);}
    if(last){h+='<div class="lab">Last result</div>'+rowFixture(last);}
    h+='</div>';
    h+='<div class="card"><h2>'+esc(tName(FT))+' — all Premier League games</h2>';
    if(tf.length){for(var k=0;k<tf.length;k++)h+=rowFixture(tf[k]);}
    else h+='<div class="empty">Fixtures not released yet.</div>';
    h+='</div>';
    el('v-hub').innerHTML=h;
  }
  function ord(n){return n==1?'st':n==2?'nd':n==3?'rd':'th';}

  // ===== TABLE =====
  function renderTable(){
    var h='';
    if(M.plPlayed>0){
      h+='<div class="card"><h2>Premier League '+esc(M.season)+'</h2>'+tableHtml(D.table)+
         '<div class="legend"><span class="eu">Top 5 (Europe)</span><span class="rel">Bottom 3</span></div></div>';
    } else {
      h+='<div class="banner">⚽ '+esc(M.season)+' starts '+esc(fmtDate(parseKO(M.startDate)))+'. The live table fills in as games are played — here\'s how last season finished.</div>';
      h+='<div class="card"><h2>'+esc(M.fplSeason)+' final table</h2>'+lastTableHtml()+'</div>';
    }
    el('v-table').innerHTML=h;
  }
  function tableHtml(rows){
    var h='<table class="lg"><thead><tr><th>#</th><th style="text-align:left">Club</th><th>Pl</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>Form</th></tr></thead><tbody>';
    for(var i=0;i<rows.length;i++){var r=rows[i];var cls=r[1]===FT?'me':(r[0]<=5?'eu':(r[0]>=18?'rel':''));
      h+='<tr class="'+cls+'"><td>'+r[0]+'</td><td class="tm"><img src="'+badge(r[1])+'" onerror="'+bErr()+'" alt=""/>'+esc(tShort(r[1]))+'</td>'+
         '<td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td><td>'+(r[6]>0?'+':'')+r[6]+'</td><td class="pt">'+r[7]+'</td><td>'+miniForm(r[8]||'')+'</td></tr>';
    }
    return h+'</tbody></table>';
  }
  function lastTableHtml(){
    var rows=D.lastTable,h='<table class="lg"><thead><tr><th>#</th><th style="text-align:left">Club</th><th>Pl</th><th>GD</th><th>Pts</th></tr></thead><tbody>';
    for(var i=0;i<rows.length;i++){var r=rows[i];
      h+='<tr class="'+(r[0]<=4?'eu':(r[0]>=18?'rel':''))+'"><td>'+r[0]+'</td><td class="tm">'+esc(r[1])+'</td><td>'+r[2]+'</td><td>'+(r[4]>0?'+':'')+r[4]+'</td><td class="pt">'+r[3]+'</td></tr>';
    }
    return h+'</tbody></table>';
  }

  // ===== FIXTURES =====
  var fixFilter=null;
  function renderFixtures(){
    if(fixFilter==null)fixFilter=FT;
    var h='<div class="chips"><button data-f="'+FT+'"'+(fixFilter===FT?' class="on"':'')+'>'+esc(tShort(FT))+'</button>'+
          '<button data-f="0"'+(fixFilter===0?' class="on"':'')+'>All clubs</button></div>';
    var list=[];for(var i=0;i<D.fixtures.length;i++){var f=D.fixtures[i];if(fixFilter===0||f[2]===fixFilter||f[3]===fixFilter)list.push(f);}
    h+='<div class="card">';
    if(!list.length)h+='<div class="empty">No fixtures yet.</div>';
    var lastGw=null;
    for(var j=0;j<list.length;j++){var f=list[j];if(f[0]!==lastGw){lastGw=f[0];h+='<div class="gw">'+(f[0]?'Gameweek '+f[0]:'TBC')+'</div>';}h+=rowFixture(f);}
    h+='</div>';
    el('v-fixtures').innerHTML=h;
  }

  // ===== CUPS =====
  // a cup fixture (opponents can be non-PL): [koISO, homeName, homeBadge, awayName, awayBadge, hs, as, status, round]
  function cupRow(f){
    var d=parseKO(f[0]), done=(f[7]==='C'&&f[5]!=null);
    var h='<div class="fixrow">';
    h+='<img class="b" src="'+esc(f[2])+'" onerror="'+bErr()+'" alt=""/><span class="tn">'+esc(f[1])+'</span>';
    if(done)h+='<span class="sc">'+f[5]+'–'+f[6]+'</span>';else h+='<span class="vs">v</span>';
    h+='<span class="tn r">'+esc(f[3])+'</span><img class="b" src="'+esc(f[4])+'" onerror="'+bErr()+'" alt=""/></div>';
    h+='<div class="fmeta">'+(f[8]?esc(f[8])+' · ':'')+esc(fmtDate(d))+(d?' · '+fmtTime(d):'')+(done?'':' <span class="cd">'+countdown(d)+'</span>')+'</div>';
    return h;
  }
  function renderCups(){
    var c=D.cups,h='';
    var icons={ucl:'⭐',efl:'🏆',fac:'🌹'};
    var keys=['ucl','efl','fac'];
    for(var i=0;i<keys.length;i++){var k=keys[i],cup=c[k];if(!cup)continue;
      var mine=(cup.byTeam&&cup.byTeam[FT])||[];
      h+='<div class="card"><div class="cup"><div class="ic">'+icons[k]+'</div><div class="cn">'+esc(cup.name)+'</div></div>';
      if(mine.length){for(var j=0;j<mine.length;j++)h+=cupRow(mine[j]);}
      else h+='<div class="note">'+esc(cup.note)+'</div>';
      h+='</div>';
    }
    h+='<div class="note" style="text-align:center;margin-top:6px">'+esc(tName(FT))+'’s cup games appear here automatically as each draw is made.</div>';
    el('v-cups').innerHTML=h;
  }

  // ===== SQUAD =====
  function renderSquad(){
    var sq=D.squads[FT];
    var h='<div class="card"><h2>'+esc(tName(FT))+' squad</h2>';
    if(!sq||!sq.length){h+='<div class="empty">Squad updates when the new Fantasy PL season opens (usually July) — '+esc(tName(FT))+' is newly promoted.</div></div>';el('v-squad').innerHTML=h;return;}
    var by={1:[],2:[],3:[],4:[]};for(var i=0;i<sq.length;i++){if(by[sq[i][2]])by[sq[i][2]].push(sq[i]);}
    for(var p=1;p<=4;p++){if(!by[p].length)continue;h+='<div class="posh">'+POS[p]+'</div><div class="grid">';
      for(var j=0;j<by[p].length;j++){var s=by[p][j]; // [code,name,pos,g,a,min]
        h+='<div class="pl"><img src="'+photo(s[0])+'" onerror="'+imgErr()+'" alt=""/><div class="nm">'+esc(s[1])+'</div>'+
           '<div class="st">'+(s[3]?'<b>'+s[3]+'</b>⚽ ':'')+(s[4]?'<b>'+s[4]+'</b>🅰':'')+(!s[3]&&!s[4]?(s[5]+' min'):'')+'</div></div>';
      }h+='</div>';
    }
    h+='<div class="note" style="margin-top:10px">Goals/assists shown are '+esc(M.fplSeason)+'. Refreshes when the new season starts.</div></div>';
    el('v-squad').innerHTML=h;
  }

  // ===== STATS =====
  function renderStats(){
    var h='<div class="banner">Top scorers &amp; assists below are '+esc(M.fplSeason)+' (final). They reset when '+esc(M.season)+' kicks off.</div>';
    h+='<div class="card"><h2>Top scorers — '+esc(M.fplSeason)+'</h2>';
    for(var i=0;i<D.scorers.length;i++){var s=D.scorers[i];h+=scrRow(i+1,s[0],s[1],s[2],s[3],s[4]+' assists');}
    h+='</div><div class="card"><h2>Most assists — '+esc(M.fplSeason)+'</h2>';
    for(var k=0;k<D.assisters.length;k++){var a=D.assisters[k];h+=scrRow(k+1,a[0],a[1],a[2],a[3],a[4]+' goals');}
    h+='</div>';
    el('v-stats').innerHTML=h;
  }
  function scrRow(rk,pcode,tcode,name,big,sub){
    return '<div class="scr"><span class="rk">'+rk+'</span><img class="pp" src="'+photo(pcode)+'" onerror="'+imgErr()+'" alt=""/>'+
      '<img class="bb" src="'+badge(tcode)+'" onerror="'+bErr()+'" alt=""/><span class="nm">'+esc(name)+'</span>'+
      '<span class="g">'+big+'</span><span class="a">'+esc(sub)+'</span></div>';
  }

  // ===== shell =====
  var RENDERED={};
  function rerenderAll(){RENDERED={};fixFilter=FT;var on=document.querySelector('.view.on');show(on?on.id.replace('v-',''):'hub');applyHeader();}
  function show(v){
    var btns=el('tabs').getElementsByTagName('button');
    for(var i=0;i<btns.length;i++)btns[i].className=btns[i].getAttribute('data-v')===v?'on':'';
    var views=document.getElementsByClassName('view');
    for(var j=0;j<views.length;j++)views[j].className='view'+(views[j].id==='v-'+v?' on':'');
    if(!RENDERED[v]){({hub:renderHub,table:renderTable,fixtures:renderFixtures,cups:renderCups,squad:renderSquad,stats:renderStats}[v])();RENDERED[v]=true;}
    window.scrollTo(0,0);try{location.hash=v;}catch(e){}
  }
  el('tabs').addEventListener('click',function(e){var b=e.target;while(b&&b.tagName!=='BUTTON')b=b.parentNode;if(b&&b.getAttribute('data-v'))show(b.getAttribute('data-v'));});
  el('v-fixtures').addEventListener('click',function(e){var b=e.target;while(b&&b!==this&&b.tagName!=='BUTTON')b=b.parentNode;if(b&&b.getAttribute&&b.getAttribute('data-f')!=null){fixFilter=parseInt(b.getAttribute('data-f'),10);RENDERED.fixtures=false;renderFixtures();RENDERED.fixtures=true;}});

  // team picker
  function buildPicker(){
    var names=[];for(var c in T)names.push([parseInt(c,10),T[c][0]]);names.sort(function(a,b){return a[1]<b[1]?-1:1;});
    var h='';for(var i=0;i<names.length;i++)h+='<option value="'+names[i][0]+'"'+(names[i][0]===FT?' selected':'')+'>'+esc(names[i][1])+'</option>';
    el('teamSel').innerHTML=h;
    el('teamSel').onchange=function(){FT=parseInt(this.value,10);try{localStorage.setItem('lfc_team',FT);}catch(e){}rerenderAll();};
  }
  function applyHeader(){
    el('hcrest').style.visibility='visible';el('hcrest').onerror=function(){this.onerror=null;this.style.visibility='hidden';};el('hcrest').src=badge(FT);
    el('htitle').textContent=tName(FT);
    el('hsub').textContent='Premier League '+M.season;
  }

  el('shareBtn').onclick=function(){var url=location.href.split('#')[0];
    if(navigator.share){navigator.share({title:'Follow your Premier League team',text:'Pick your club — fixtures, table, cups, scorers',url:url}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(url);this.textContent='Copied!';var b=this;setTimeout(function(){b.textContent='Share';},1500);}
  };

  if(M.built){var bd=new Date(M.built);el('built').textContent='Updated '+(isNaN(bd)?M.built:bd.toLocaleString());}
  el('buildtag').textContent=BUILD_TAG;
  buildPicker();applyHeader();
  var init=(location.hash||'').replace('#','');
  show(({hub:1,table:1,fixtures:1,cups:1,squad:1,stats:1}[init])?init:'hub');
})();
</script>
</body>
</html>
