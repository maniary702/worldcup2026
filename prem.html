<style>
  :root{--pur:#37003c;--pur2:#2a002e;--pink:#e90052;--grn:#00c46a;--ink:#1a1a1a;--mut:#6b7280;--line:#e6e7eb;--bg:#f4f5f7;--card:#fff;--w:#16a34a;--d:#9ca3af;--l:#dc2626}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}
  img{display:block}
  .wrap{max-width:680px;margin:0 auto;padding:0 12px 80px}
  header{background:linear-gradient(135deg,var(--pur),var(--pur2));color:#fff;padding:12px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .hd{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .hd .crest{width:40px;height:40px;flex:0 0 auto;background:#fff;border-radius:9px;padding:3px}
  .hd .crest img{width:100%;height:100%;object-fit:contain}
  .hd h1{font-size:15px;margin:0;font-weight:800;line-height:1.05}
  .hd .sub{font-size:11px;opacity:.85;font-weight:600}
  .hd .share{margin-left:auto;background:var(--pink);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-weight:800;font-size:12px;cursor:pointer}
  .teambar{max-width:680px;margin:8px auto 0;display:flex;align-items:center;gap:8px}
  .teambar label{font-size:11px;font-weight:700;opacity:.85;color:#fff}
  .teambar select{flex:1;border:0;border-radius:10px;padding:9px 10px;font-weight:800;font-size:14px;background:#fff;color:var(--pur)}
  nav.tabs{position:sticky;top:108px;z-index:20;background:var(--bg);max-width:680px;margin:0 auto;display:flex;gap:6px;padding:10px 12px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer}
  nav.tabs button.on{background:var(--pur);color:#fff;border-color:var(--pur)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:0 0 10px}
  .view{display:none}.view.on{display:block}
  .hero{background:var(--card);border:2px solid var(--pur);border-radius:16px;padding:14px;margin:12px 0}
  .hero .top{display:flex;align-items:center;gap:12px}
  .hero .top img{width:52px;height:52px;object-fit:contain}
  .hero .tn{font-size:20px;font-weight:900;line-height:1}
  .hero .ssub{font-size:12px;color:var(--mut);font-weight:700;margin-top:3px}
  .cdbig{margin-left:auto;text-align:center;background:var(--pur);color:#fff;border-radius:12px;padding:8px 12px}
  .cdbig b{font-size:22px;font-weight:900;display:block;line-height:1}
  .cdbig span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.85}
  .pos{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
  .posnum{font-size:34px;font-weight:900;color:var(--pur);line-height:1}
  .poslab{font-size:12px;color:var(--mut);font-weight:700}
  .ptsb{margin-left:auto;text-align:right}.ptsb b{font-size:26px;font-weight:900}
  .form{display:flex;gap:5px;margin-top:8px}
  .fp{width:22px;height:22px;border-radius:6px;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
  .fp.W{background:var(--w)}.fp.D{background:var(--d)}.fp.L{background:var(--l)}
  .lab{font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .fixrow{display:flex;align-items:center;gap:8px;padding:6px 0}
  .fixrow img.b{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
  .fixrow .tn{font-weight:700;font-size:13px;flex:1}
  .fixrow .tn.r{text-align:right}
  .fixrow .sc{font-weight:900;font-size:15px;white-space:nowrap;padding:0 4px}
  .fixrow .vs{color:var(--mut);font-weight:700;padding:0 4px}
  .fmeta{font-size:11px;color:var(--mut);font-weight:600;margin:-2px 0 6px 32px}
  .cd{color:var(--pink);font-weight:800}
  table.lg{width:100%;border-collapse:collapse;font-size:13px}
  table.lg th{font-size:10px;text-transform:uppercase;color:var(--mut);text-align:center;padding:6px 3px;font-weight:800}
  table.lg td{padding:7px 3px;text-align:center;border-top:1px solid var(--line)}
  table.lg td.tm{text-align:left;font-weight:700;white-space:nowrap}
  table.lg td.tm img{width:20px;height:20px;object-fit:contain;display:inline-block;vertical-align:middle;margin-right:6px}
  table.lg tr.eu td{box-shadow:inset 3px 0 0 var(--grn)}
  table.lg tr.rel td{box-shadow:inset 3px 0 0 var(--l)}
  table.lg tr.me{background:#faf0fb;font-weight:800}
  table.lg td.pt{font-weight:900}
  .miniform{display:inline-flex;gap:2px;margin-left:4px}
  .miniform i{width:7px;height:7px;border-radius:2px;display:inline-block}
  .miniform i.W{background:var(--w)}.miniform i.D{background:var(--d)}.miniform i.L{background:var(--l)}
  .legend{font-size:11px;color:var(--mut);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .legend .eu::before{background:var(--grn)}.legend .rel::before{background:var(--l)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
  .chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink)}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .gw{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .pl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
  .pl img{width:62px;height:79px;object-fit:cover;object-position:top;margin:0 auto 4px;border-radius:8px;background:#eef0f3}
  .pl .nm{font-weight:800;font-size:12px;line-height:1.15;min-height:28px;display:flex;align-items:center;justify-content:center}
  .pl .st{font-size:11px;color:var(--mut);margin-top:2px}.pl .st b{color:var(--pink)}
  .posh{font-size:12px;font-weight:800;color:var(--pur);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  .scr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .scr:first-child{border-top:0}
  .scr .rk{width:20px;text-align:center;font-weight:800;color:var(--mut)}
  .scr img.pp{width:34px;height:43px;object-fit:cover;object-position:top;border-radius:7px;background:#eef0f3}
  .scr img.bb{width:18px;height:18px;object-fit:contain}
  .scr .nm{font-weight:700}
  .scr .g{margin-left:auto;font-weight:900;font-size:16px;color:var(--pink)}
  .scr .a{font-size:11px;color:var(--mut);font-weight:700;width:54px;text-align:right}
  .cup{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .cup .ic{width:38px;height:38px;border-radius:9px;background:var(--pur);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
  .cup .cn{font-weight:800}
  .note{font-size:12px;color:var(--mut);font-weight:600;line-height:1.5}
  .banner{background:linear-gradient(135deg,var(--pink),#b8003f);color:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:13px;margin:10px 0}
  footer{max-width:680px;margin:18px auto 0;text-align:center;color:var(--mut);font-size:11px;line-height:1.6}
  .empty{text-align:center;color:var(--mut);padding:22px 10px;font-weight:600}
  /* ===== match-stat click-through ===== */
  .fixwrap{border-radius:10px;padding:2px 4px;margin:2px -4px}
  .fixwrap.clk{cursor:pointer}
  .fixwrap.clk:hover{background:#faf5fb}
  .fixwrap.clk:active{background:#f3e8f5}
  .mstat{float:right;color:var(--pur);font-weight:800;font-size:11px}
  .mm{position:fixed;inset:0;z-index:60;background:rgba(20,10,25,.55);display:none;align-items:flex-end;justify-content:center}
  .mm.on{display:flex}
  .mmcard{background:var(--card);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 14px 26px;position:relative;-webkit-overflow-scrolling:touch}
  @media(min-width:560px){.mm{align-items:center}.mmcard{border-radius:18px}}
  .mmx{position:absolute;top:10px;right:10px;border:0;background:var(--bg);color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:15px;font-weight:800;cursor:pointer;z-index:2}
  .mmhd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 2px}
  .mmt{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
  .mmt img{width:46px;height:46px;object-fit:contain}
  .mmt span{font-weight:800;font-size:12px;line-height:1.15}
  .mmsc{font-size:30px;font-weight:900;text-align:center;line-height:1;white-space:nowrap}
  .mmsc .dash{font-size:18px;color:var(--mut);margin:0 3px;vertical-align:middle;font-weight:800}
  .mmst{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
  .mmst.live{color:var(--pink)}
  .mmdate{text-align:center;color:var(--mut);font-size:11px;font-weight:700;margin:2px 0 12px}
  .mmsec{border-top:1px solid var(--line);padding-top:10px}
  .mmempty{border-top:1px solid var(--line);padding:18px 4px;text-align:center;color:var(--mut);font-weight:600;font-size:13px}
  .srow{margin:10px 0}
  .srow .tp{display:flex;justify-content:space-between;align-items:baseline}
  .srow .tp b{font-size:13px;font-weight:900}
  .srow .tp .lab{color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.4px;font-size:10px}
  .srow .bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:4px}
  .srow .bar i{display:block;height:100%}
  .srow .bar i.h{background:var(--pink)}.srow .bar i.a{background:var(--pur)}
  .mmh{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;border-top:1px solid var(--line);padding-top:12px}
  .tml{display:flex;flex-direction:column;gap:6px}
  .te{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;width:82%}
  .te .min{color:var(--mut);font-weight:800;font-size:11px;min-width:26px}
  .te .ic{font-size:13px}
  .te .pl em{color:var(--mut);font-style:normal;font-weight:600;font-size:11px}
  .te.a{flex-direction:row-reverse;align-self:flex-end;text-align:right}
  .lus{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .luf{display:inline-block;background:var(--pur);color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:10px;margin-bottom:6px}
  .lul{list-style:none;margin:0;padding:0}
  .lul li{font-size:12px;padding:3px 0;border-bottom:1px solid var(--line)}
  .lul li b{display:inline-block;min-width:20px;color:var(--mut);font-weight:800}
  .lusb{font-size:11px;color:var(--mut);margin-top:7px;line-height:1.5}
  .luco{font-size:11px;color:var(--mut);margin-top:5px;font-weight:700}
  /* ===== first-run team picker ===== */
  .pick{position:fixed;inset:0;z-index:70;background:linear-gradient(135deg,var(--pur),var(--pur2));color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px}
  .pick.on{display:flex}
  .pick .ball{width:74px;height:74px;margin-bottom:14px}
  .pick h2{font-size:22px;font-weight:900;margin:0 0 6px;line-height:1.15}
  .pick p{font-size:13px;opacity:.85;margin:0 0 22px;font-weight:600;max-width:320px}
  .pick select{width:100%;max-width:320px;border:0;border-radius:12px;padding:14px 12px;font-weight:800;font-size:16px;background:#fff;color:var(--pur);margin-bottom:14px}
  .pick button{width:100%;max-width:320px;border:0;border-radius:24px;padding:14px;font-weight:900;font-size:16px;background:var(--grn);color:var(--pur);cursor:pointer}
  /* ================= ANFIELD DARK — premium reskin (v5) ================= */
  :root{  /* DARK is the default — no class needed = the currently-deployed look */
    --pur:#E51B39; --pur2:#B0122C; --pink:#E51B39; --grn:#33D27F;
    --ink:#F6EEEF; --mut:#AD939A; --line:rgba(255,255,255,.08); --bg:#0b0708; --card:#160e11;
    --w:#33D27F; --d:#8C7A55; --l:#C33048;
    --red:#E51B39; --red-deep:#C8102E; --gold:#F4C868; --live:#33D27F;
    --text:#F6EEEF; --faint:#7d666c; --line2:rgba(255,255,255,.14); --card2:#20141a;
    --sel:rgba(229,27,57,.14); --glow:rgba(229,27,57,.16); --shadow:rgba(0,0,0,.6);
    --header-bg:linear-gradient(180deg,rgba(14,9,10,.93),rgba(14,9,10,.64));
    --nav-bg:linear-gradient(0deg,rgba(9,5,6,.98),rgba(9,5,6,.85));
    --field:rgba(255,255,255,.06); --hover:rgba(255,255,255,.05); --ph:#241016; --track:rgba(255,255,255,.08); --bar-a:#4a353b;
  }
  html.light{  /* LIGHT theme — same design, light palette */
    --pur:#C8102E; --pur2:#9c0c22; --pink:#C8102E; --grn:#12a150;
    --ink:#1b1216; --mut:#6f6169; --line:rgba(20,10,16,.10); --bg:#f2f0f2; --card:#ffffff;
    --w:#12a150; --d:#b08a2e; --l:#d0263f;
    --red:#D01330; --red-deep:#A50E26; --gold:#a9770d; --live:#12a150;
    --text:#1b1216; --faint:#9a8f96; --line2:rgba(20,10,16,.16); --card2:#ffffff;
    --sel:rgba(200,16,46,.08); --glow:rgba(200,16,46,.10); --shadow:rgba(0,0,0,.14);
    --header-bg:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.74));
    --nav-bg:linear-gradient(0deg,rgba(255,255,255,.98),rgba(255,255,255,.9));
    --field:rgba(20,10,16,.05); --hover:rgba(20,10,16,.04); --ph:#e8eaf0; --track:rgba(20,10,16,.10); --bar-a:#d7c7cc;
  }
  html,body{background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(120% 55% at 50% -8%,var(--glow),transparent 60%),var(--bg);background-attachment:fixed}
  .wrap{padding-bottom:110px}
  /* header → dark glass */
  header{background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:none;color:var(--text)}
  .hd h1{color:var(--text);letter-spacing:-.01em}
  .hd .sub{color:var(--mut);opacity:1}
  .hd .crest{background:#fff;box-shadow:0 2px 12px rgba(229,27,57,.4)}
  .hd .share{background:linear-gradient(180deg,var(--red),var(--red-deep));color:#fff;box-shadow:0 8px 20px -10px rgba(229,27,57,.6)}
  .hd .tmode{flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:50%;background:var(--field);border:1px solid var(--line2);color:var(--text);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .teambar label{color:var(--mut);opacity:1}
  .teambar select{background:var(--field);color:var(--text);border:1px solid var(--line2)}
  /* cards */
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:0 18px 40px -26px var(--shadow);border-radius:16px}
  .card h2{color:var(--mut)}
  /* hero */
  .hero{background:radial-gradient(120% 90% at 0 0,var(--glow),transparent 55%),linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:18px;box-shadow:0 22px 46px -26px var(--shadow)}
  .hero .tn{color:var(--text)}.hero .ssub{color:var(--mut)}
  .cdbig{background:linear-gradient(180deg,var(--red),var(--red-deep));box-shadow:0 10px 22px -12px rgba(229,27,57,.7)}
  .posnum{color:var(--red)}.poslab{color:var(--mut)}
  .lab{color:var(--mut);border-top-color:var(--line)}
  /* fixture rows */
  .fixwrap.clk:hover{background:var(--hover)}
  .fixwrap.clk:active{background:var(--field)}
  .mstat{color:var(--red)}.fixrow .sc{color:var(--text)}.fmeta{color:var(--mut)}.cd{color:var(--red)}
  /* table */
  table.lg th{color:var(--faint)}
  table.lg td{border-top-color:var(--line)}
  table.lg tr.me{background:var(--sel)}
  table.lg tr.me td{color:var(--text)}
  .miniform i.D{background:var(--d)}
  .legend{color:var(--mut)}
  .xg{color:var(--mut);font-weight:700}
  /* fixtures filter chips */
  .chips button{background:var(--field);border:1px solid var(--line2);color:var(--text)}
  .chips button.on{background:var(--red);border-color:var(--red);color:#fff}
  .gw{color:var(--mut)}
  /* squad + scorers */
  .pl{background:var(--card);border-color:var(--line)}
  .pl img{background:var(--ph)}.pl .st{color:var(--mut)}
  .posh{color:var(--red)}
  .scr{border-top-color:var(--line)}.scr img.pp{background:var(--ph)}
  .scr .g{color:var(--red)}.scr .a{color:var(--mut)}
  /* cups + notes + footer */
  .cup .ic{background:linear-gradient(180deg,var(--red),var(--red-deep))}
  .note{color:var(--mut)}
  footer{color:var(--faint)}.empty{color:var(--mut)}
  /* match modal → dark */
  .mm{background:rgba(6,3,4,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .mmcard{background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:0 -20px 60px -18px var(--shadow)}
  .mmx{background:var(--field);color:var(--text)}
  .mmsc{color:var(--text)}.mmst.live{color:var(--live)}
  .mmsec{border-top-color:var(--line)}.mmempty{border-top-color:var(--line);color:var(--mut)}
  .srow .bar{background:var(--track)}
  .srow .bar i.h{background:linear-gradient(90deg,var(--red-deep),var(--red))}
  .srow .bar i.a{background:var(--bar-a)}
  .mmh{color:var(--mut);border-top-color:var(--line)}
  .lul li{border-bottom-color:var(--line)}
  .luf{background:linear-gradient(180deg,var(--red),var(--red-deep))}
  .te .pl em{color:var(--mut)}
  /* player ratings + POTM (modal) */

  // ===== MATCH STATS (API-Football, baked keyless into prem_afstats.json) =====
  function num(v){return (v===0||v)?+v:null;}
  function statBar(label,hv,av,dec){
    if(hv==null&&av==null)return '';
    var hn=num(hv),an=num(av);
    var hs=(hn==null)?'–':(dec?hn.toFixed(1):hn), as=(an==null)?'–':(dec?an.toFixed(1):an);
    var tot=(hn==null?0:hn)+(an==null?0:an), hp=tot>0?Math.round((hn==null?0:hn)/tot*100):50;
    return '<div class="srow"><div class="tp"><b>'+hs+'</b><span class="lab">'+esc(label)+'</span><b>'+as+'</b></div>'+
           '<div class="bar"><i class="h" style="width:'+hp+'%"></i><i class="a" style="width:'+(100-hp)+'%"></i></div></div>';
  }
  // ===== live-clock reconciliation =====
  // Two independent snapshots of a match live on this page: the pulselive FIXTURE (status + score,
  // NO minute, baked) and the afstats entry (minute + phase, baked). A live match only moves forward,
  // so a "complete" fixture must beat a stale afstats live-minute. clockNum/bestLiveClock are the WC
  // page's tested "furthest-along clock" — installed verbatim so a fresh client-side PL live feed can
  // drop straight in as the 2nd minute source (today it carries none, so bestLiveClock returns the bake).
  function clockNum(s){var mt=/(\d+)(?:\s*\+\s*(\d+))?/.exec(String(s||''));if(!mt)return null;return parseInt(mt[1],10)+(mt[2]?parseInt(mt[2],10):0);}
  function bestLiveClock(af,st){var ft=(st&&st.t)||'',fn=clockNum(ft);
    if(af&&(af.st==='P'||af.st==='PEN'))return 'PENS';
    if(fn==null&&/HT|PEN/i.test(ft))return ft;
    var an=(af&&af.min!=null&&af.min!==''&&af.st!=='FT'&&af.st!=='NS')?clockNum(af.min):null;
    if(an!=null&&(fn==null||an>fn))return ((af.st==='ET'||af.st==='BT')?'ET ':'')+an+"'";
    if(fn!=null)return ft;
    return ft||'Live';}
  function fxByKey(key){for(var i=0;i<D.fixtures.length;i++){var f=D.fixtures[i];if(f[2]+'_'+f[3]===key)return f;}return null;}
  function fixtureDone(f){return !!(f&&f[6]==='C'&&f[4]!=null);}   // pulselive says finished (has a final score)
  function statusLabel(e,f){
    if(fixtureDone(f))return 'Full time';                          // fresh FT beats a stale afstats live-minute
    var s=e.st;
    if(s==='FT')return 'Full time';if(s==='AET')return 'After extra time';
    if(s==='PEN'||s==='P')return 'Penalties';if(s==='HT')return 'Half time';
    if(s==='NS')return 'Kick-off soon';
    if(LIVE_RE.test(s))return bestLiveClock(e,{t:''});             // furthest-along minute (2nd feed has none yet)
    return s||'';}

    if(t==='goal')return /own/i.test(detail)?'⚽':(/pen/i.test(detail)?'🎯':'⚽');
    if(t==='card')return /red/i.test(detail)?'🟥':'🟨';

  // ---- season xG difference per team, from the baked API-Football match data ----
  var _xg=null, AFP=null, AFP_TRIED=false, curMatch=null;
  function teamXG(){
    if(_xg)return _xg; _xg={};
    if(AF&&AF.m){for(var k in AF.m){var e=AF.m[k],s=e.stats;if(!s)continue;
      var hx=s.home&&s.home.xg, ax=s.away&&s.away.xg; if(hx==null&&ax==null)continue;
      hx=parseFloat(hx)||0; ax=parseFloat(ax)||0;
      var H=_xg[e.hc]||(_xg[e.hc]={f:0,a:0}); H.f+=hx; H.a+=ax;

  // ---- player ratings / player-of-the-match (lazy-loaded prem_afplayers.json) ----

  }
  function ratLine(p){ var b=[]; if(p[3])b.push(p[3]+"'"); if(p[4])b.push(p[4]+(p[4]>1?' goals':' goal'));

  document.addEventListener('keydown',function(e){if(e.keyCode===27){if(el('mm').classList.contains('on'))closeMatch();else if(el('tm').classList.contains('on'))closeTeam();return;}if(e.keyCode!==13&&e.keyCode!==32)return;var a=actEl(e.target);if(a){e.preventDefault();doAct(a);}});
  function applyAF(){var on=document.querySelector('.view.on');if(!on)return;var v=on.id.replace('v-','');if(v==='hub'||v==='fixtures'||v==='table'){var y=window.pageYOffset;RENDERED[v]=false;({hub:renderHub,fixtures:renderFixtures,table:renderTable}[v])();RENDERED[v]=true;window.scrollTo(0,y);}}
  function loadAF(){if(!window.fetch)return;fetch('prem_afstats.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d&&d.m){AF=d;_xg=null;applyAF();}}).catch(function(){});}

  // ===== NEWS =====
  // Real RSS baked keyless into prem_news.json (BBC Sport + The Guardian). We show the headline +
  // the publisher's own summary and always link BACK to the source — never a rehosted article.
  var NEWS=null, NEWS_TRIED=false;
  function curView(){var on=document.querySelector('.view.on');return on?on.id.replace('v-',''):'';}
  function loadNews(){
    if(NEWS||NEWS_TRIED)return; NEWS_TRIED=true;
    if(!window.fetch)return;
    fetch('prem_news.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;})
      .then(function(d){if(d&&(d.team||d.league))NEWS=d;if(curView()==='news')renderNews();})
      .catch(function(){if(curView()==='news')renderNews();});
  }
  function timeAgo(d){if(!d)return '';var s=(Date.now()-d.getTime())/1000;if(s<0)return '';
    if(s<60)return 'just now';var m=Math.floor(s/60);if(m<60)return m+'m ago';
    var h=Math.floor(m/60);if(h<24)return h+'h ago';var dd=Math.floor(h/24);return dd===1?'yesterday':dd+'d ago';}
  function newsRow(it){ // [title,link,iso,source,desc]
    var d=parseKO(it[2]);
    return '<a class="nw" href="'+esc(it[1])+'" target="_blank" rel="noopener noreferrer">'+
      '<div class="nwt">'+esc(it[0])+'</div>'+
      (it[4]?'<div class="nwd">'+esc(it[4])+'</div>':'')+
      '<div class="nwm"><span class="nws">'+esc(it[3])+'</span>'+(d?' · '+esc(timeAgo(d)):'')+'</div></a>';
  }
  function newsHero(it){ // [title,link,iso,source,desc,img] — the club's top story
    var d=parseKO(it[2]);
    return '<a class="nh" href="'+esc(it[1])+'" target="_blank" rel="noopener noreferrer">'+
      (it[5]?'<div class="nhi"><img src="'+esc(it[5])+'" alt="" loading="lazy" onerror="this.parentNode.style.display=\'none\'"/></div>':'')+
      '<div class="nhb"><div class="nhk">Top story</div><div class="nht">'+esc(it[0])+'</div>'+
      (it[4]?'<div class="nhd">'+esc(it[4])+'</div>':'')+
      '<div class="nwm"><span class="nws">'+esc(it[3])+'</span>'+(d?' · '+esc(timeAgo(d)):'')+'</div></div></a>';
  }
  function newsCard(title,items){
    if(!items||!items.length)return '';
    var h='<div class="card"><h2>'+esc(title)+'</h2>';
    for(var i=0;i<items.length;i++)h+=newsRow(items[i]);
    return h+'</div>';
  }
  function renderNews(){
    if(!NEWS){el('v-news').innerHTML='<div class="card"><div class="empty">Loading the latest football news…</div></div>';loadNews();return;}
    var mine=(NEWS.team&&NEWS.team[FT])||[];
    var h='<div class="card"><h2>'+esc(tName(FT))+' — latest</h2>';
    if(mine.length){h+=newsHero(mine[0]);for(var i=1;i<mine.length;i++)h+=newsRow(mine[i]);}
    else h+='<div class="empty">No '+esc(tName(FT))+' stories in the feed right now.</div>';
    h+='</div>';
    h+=newsCard('Transfer gossip',NEWS.gossip);
    h+=newsCard('Premier League',NEWS.league);
    h+='<div class="note" style="margin-top:10px">Headlines from BBC Sport &amp; The Guardian — tap any story to read it in full at the source.</div>';
    el('v-news').innerHTML=h;
  }

  // ===== TEAM HUB (tap any crest / name — real data only) =====
  function teamTableRow(code){for(var i=0;i<D.table.length;i++){if(D.table[i][1]===code)return D.table[i];}return null;}
  function lastRow(code){var lt=D.lastTable||[];for(var i=0;i<lt.length;i++){if(lt[i][5]===code)return lt[i];}return null;}
  function computeRecord(code){
    var r={pld:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,form:'',home:{w:0,d:0,l:0},away:{w:0,d:0,l:0}};
    var tf=teamFixtures(code),fs=[];
    for(var i=0;i<tf.length;i++){var f=tf[i];if(f[6]!=='C'||f[4]==null)continue;
      var home=f[2]===code,gf=home?f[4]:f[5],ga=home?f[5]:f[4],s=home?r.home:r.away;
      r.pld++;r.gf+=gf;r.ga+=ga;
      if(gf>ga){r.w++;s.w++;fs.push('W');}else if(gf===ga){r.d++;s.d++;fs.push('D');}else{r.l++;s.l++;fs.push('L');}}
    r.pts=r.w*3+r.d;r.gd=r.gf-r.ga;r.form=fs.slice(-5).join('');return r;
  }
  function tmCell(val,lab,hl){return '<div class="tmcell'+(hl?' hl':'')+'"><b>'+val+'</b><span>'+lab+'</span></div>';}
  function ordSup(n){return '<sup style="font-size:.5em">'+ord(n)+'</sup>';}
  function teamHtml(code){
    var rec=computeRecord(code),lr=lastRow(code),xg=(teamXG()||{})[code];
    var tr=teamTableRow(code),pos=(tr&&M.plPlayed>0)?tr[0]:null;
    var tf=teamFixtures(code),next=null,last=null;
    for(var i=0;i<tf.length;i++){if(tf[i][6]==='C'&&tf[i][4]!=null)last=tf[i];else if(!next)next=tf[i];}
    var h='<div class="tmhd"><img class="tmcr" src="'+badge(code)+'" onerror="'+bErr()+'" alt=""/>'+
      '<div><div class="tmn">'+esc(tName(code))+'</div><div class="tmsub">Premier League '+esc(M.season)+'</div></div>'+
      (pos?'<div class="tmpos"><b>'+pos+ordSup(pos)+'</b><span>in the table</span></div>':'')+'</div>';
    h+='<div class="mmh">This season · '+esc(M.season)+'</div>';
    if(rec.pld>0){
      h+='<div class="tmgrid">'+tmCell(rec.pld,'Played')+tmCell(rec.w,'Won')+tmCell(rec.d,'Drawn')+tmCell(rec.l,'Lost')+'</div>';
      h+='<div class="tmgrid">'+tmCell(rec.gf,'Goals')+tmCell(rec.ga,'Conceded')+tmCell((rec.gd>0?'+':'')+rec.gd,'Goal diff')+tmCell(rec.pts,'Points',1)+'</div>';
      if(rec.form)h+='<div style="margin-top:8px">'+formPills(rec.form)+'</div>';
      if(xg)h+='<div class="tmxg"><div><b>'+xg.f.toFixed(1)+'</b> <span class="lab">xG for</span></div><div><span class="lab">xG against</span> <b>'+xg.a.toFixed(1)+'</b></div></div>';
      h+='<div class="tmsplit"><div class="tmha"><div class="t">Home</div><div class="v">'+rec.home.w+'W '+rec.home.d+'D '+rec.home.l+'L</div></div>'+
         '<div class="tmha"><div class="t">Away</div><div class="v">'+rec.away.w+'W '+rec.away.d+'D '+rec.away.l+'L</div></div></div>';
    } else {
      h+='<div class="tmnote">Season kicks off '+esc(fmtDate(parseKO(M.startDate)))+'. Live position, form, goals and xG appear here as games are played.</div>';
    }
    if(next||last){h+='<div class="mmh">Fixtures</div>';if(next)h+=rowFixture(next);if(last)h+=rowFixture(last);}
    if(lr){h+='<div class="mmh">2025/26 final</div>';
      h+='<div class="tmgrid">'+tmCell(lr[0]+ordSup(lr[0]),'Finished')+tmCell(lr[6],'Won')+tmCell(lr[7],'Drawn')+tmCell(lr[8],'Lost')+'</div>';
      h+='<div class="tmgrid">'+tmCell(lr[9],'Goals')+tmCell(lr[10],'Conceded')+tmCell((lr[4]>0?'+':'')+lr[4],'Goal diff')+tmCell(lr[3],'Points',1)+'</div>';}
    var ts=[];for(var j=0;j<D.scorers.length;j++){if(D.scorers[j][1]===code)ts.push(D.scorers[j]);}
    if(ts.length){h+='<div class="mmh">Top scorers · '+esc(M.fplSeason)+'</div>';
      for(var k=0;k<Math.min(ts.length,5);k++){var s=ts[k];h+=scrRow(k+1,s[0],s[1],s[2],s[3],s[4]+' assists');}}
    var sq=D.squads[code];
    if(sq)h+='<div class="tmnote" style="margin-top:12px">Squad: '+sq.length+' players — follow this club and open the Squad tab for the full list.</div>';
    return h;
  }
  function openTeam(code){if(!T[code])return;closeMatch();el('tmBody').innerHTML=teamHtml(code);el('tm').classList.add('on');document.body.style.overflow='hidden';el('tmClose').focus();}
  function closeTeam(){el('tm').classList.remove('on');if(!el('mm').classList.contains('on'))document.body.style.overflow='';}
  el('tmClose').onclick=closeTeam;
  el('tm').addEventListener('click',function(e){if(e.target===this)closeTeam();});

  // team picker
  function buildPicker(){
    var names=[];for(var c in T)names.push([parseInt(c,10),T[c][0]]);names.sort(function(a,b){return a[1]<b[1]?-1:1;});
    var h='';for(var i=0;i<names.length;i++)h+='<option value="'+names[i][0]+'"'+(names[i][0]===FT?' selected':'')+'>'+esc(names[i][1])+'</option>';
    el('teamSel').innerHTML=h;
    if(el('pickSel'))el('pickSel').innerHTML=h;
    el('teamSel').onchange=function(){FT=parseInt(this.value,10);try{localStorage.setItem('lfc_team',FT);}catch(e){}rerenderAll();};
  }
  function applyHeader(){
    el('hcrest').style.visibility='visible';el('hcrest').onerror=function(){this.onerror=null;this.style.visibility='hidden';};el('hcrest').src=badge(FT);
    el('htitle').textContent=tName(FT);
    el('hsub').textContent='Premier League '+M.season;
  }

  el('shareBtn').onclick=function(){var url=location.href.split('#')[0];
    if(navigator.share){navigator.share({title:'Follow your Premier League team',text:'Pick your club — fixtures, table, cups, scorers',url:url}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(url);this.textContent='Copied!';var b=this;setTimeout(function(){b.textContent='Share';},1500);}
  };

  if(M.built){var bd=new Date(M.built);el('built').textContent='Updated '+(isNaN(bd)?M.built:bd.toLocaleString());}
  el('buildtag').textContent=BUILD_TAG;
  // light / dark theme (persisted; defaults to the device preference)
  (function(){
    function applyTheme(t){var d=document.documentElement;if(t==='light')d.classList.add('light');else d.classList.remove('light');
      var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',t==='light'?'#f2f0f2':'#0b0708');
      var b=el('themeBtn');if(b)b.textContent=(t==='light'?'☀️':'🌙');}
    var th=null;try{th=localStorage.getItem('prem_theme');}catch(e){}
    if(th!=='light'&&th!=='dark')th=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    applyTheme(th);
    var tb=el('themeBtn');if(tb)tb.onclick=function(){th=document.documentElement.classList.contains('light')?'dark':'light';try{localStorage.setItem('prem_theme',th);}catch(e){}applyTheme(th);};
  })();
  buildPicker();applyHeader();
  el('pickGo').onclick=function(){var v=parseInt(el('pickSel').value,10);if(v&&T[v]){FT=v;el('teamSel').value=String(v);try{localStorage.setItem('lfc_team',FT);}catch(e){}}el('pick').classList.remove('on');document.body.style.overflow='';rerenderAll();};
  var init=(location.hash||'').replace('#','');
  show(({hub:1,news:1,table:1,fixtures:1,cups:1,squad:1,stats:1}[init])?init:'hub');
  if(FIRST){el('pick').classList.add('on');document.body.style.overflow='hidden';}
  loadAF();
})();
</script>
